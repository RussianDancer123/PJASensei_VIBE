<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PJASensei</title>
  <script defer src="/app.js"></script>
  <script defer src="/vendor/alpine-3.17.5.min.js"></script>
</head>
<body>
  <h1>PJASensei</h1>

  <div x-data="session">
    <p x-show="error" role="alert" x-text="error"></p>
    <template x-if="me">
      <div>
        <p>Signed in as <strong x-text="me.username"></strong></p>
        <p>Roles: <strong x-text="me.roles.join(', ') || 'none'"></strong></p>
        <button @click="signOut">Sign out</button>

        <section x-show="isInstructor">
          <h2>ClassGroups</h2>
          <button @click="refresh" :disabled="refreshing" x-text="refreshing ? 'Refreshing…' : 'Refresh'"></button>

          <template x-if="refreshFailures.length > 0">
            <div role="alert">
              <p>Refresh could not do all of this:</p>
              <ul>
                <template x-for="failure in refreshFailures">
                  <li x-text="[failure.classGroup, failure.person, failure.reason].filter(Boolean).join(': ')"></li>
                </template>
              </ul>
            </div>
          </template>

          <p x-show="classGroups.length === 0">No ClassGroups with Students to show. Click Refresh to load the ones you teach.</p>
          <form x-show="classGroups.length > 0" @submit.prevent="send">
            <h2>Send an Assignment</h2>
            <p><label>Title <input type="text" x-model="title" required maxlength="200"></label></p>
            <p><label>Public GitHub URL
              <input type="url" x-model="sourceUrl" required placeholder="https://github.com/owner/repository">
            </label></p>

            <p><label>Search by Student Number <input type="search" x-model="search"></label></p>
            <template x-for="classGroup in classGroups" :key="classGroup.name">
              <details x-show="matchingStudents(classGroup).length > 0" :open="search !== ''">
                <summary>
                  <label>
                    <input type="checkbox"
                           :checked="isWholeClassGroupSelected(classGroup)"
                           @change="selectWholeClassGroup(classGroup, $event.target.checked)">
                    <span x-text="`${classGroup.name} (${classGroup.students.length})`"></span>
                  </label>
                </summary>
                <ul>
                  <template x-for="student in matchingStudents(classGroup)" :key="student.sub">
                    <li>
                      <label>
                        <input type="checkbox" :value="student.sub" x-model="selected">
                        <span x-text="`${student.studentNumber} (${student.email})`"></span>
                      </label>
                    </li>
                  </template>
                </ul>
              </details>
            </template>

            <p><button :disabled="sendStep !== null || selected.length === 0"
                       x-text="`Send to ${selected.length} selected`"></button></p>
          </form>

          <p x-show="sendStep === 'copying'" role="status">Copying the repository… <progress></progress></p>
          <p x-show="sendStep === 'creating'" role="status">
            Repository copied. Creating StudentRepositories… <progress></progress>
          </p>
          <p x-show="sentMessage" role="status" x-text="sentMessage"></p>
          <p x-show="sendError" role="alert" x-text="sendError"></p>
        </section>
      </div>
    </template>
    <button x-show="!me && !loading" @click="signIn">Sign in</button>
  </div>

  <div x-data="{ status: 'checking' }"
       x-init="fetch('/api/status').then(r => r.json()).then(s => status = s.status).catch(() => status = 'unreachable')">
    Spring: <strong x-text="status"></strong>
  </div>
</body>
</html>
