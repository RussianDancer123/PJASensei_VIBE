spring:
  application:
    name: PJASensei_VIBE
  config:
    # The stack provisions the Gitea API token as a file named after its property.
    import: optional:configtree:/run/pjasensei-secrets/
  http:
    clients:
      connect-timeout: 5s
      read-timeout: 30s

pjasensei:
  identity:
    # A number plus one of these: 17w gives Instructor and 17c gives Student.
    instructor-group-suffix: w
    class-group-suffix: c
