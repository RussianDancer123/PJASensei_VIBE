server:
  tomcat:
    # What Tomcat reads of a refused body before it cuts the connection. Over the message limit, so
    # that a Student who sends somewhat too much gets the answer saying so.
    max-swallow-size: 64MB

spring:
  application:
    name: PJASensei_VIBE
  config:
    # The stack provisions the Gitea API token as a file named after its property.
    import: optional:configtree:/run/pjasensei-secrets/
  http:
    clients:
      connect-timeout: 5s
      read-timeout: 30s

pjasensei:
  assignments:
    allowed-source-hosts: github.com
  gitea:
    import-timeout: 5m
  tutor:
    max-file-size: 2MB
    max-message-size: 10MB
  identity:
    # A number plus one of these: 17w gives Instructor and 17c gives Student.
    instructor-group-suffix: w
    class-group-suffix: c
